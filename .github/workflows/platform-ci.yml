name: Enterprise Platform CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  platform-contract:
    name: Platform Contract
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - services/orders-service
          - services/auth-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Make platform CLI executable
        run: |
          chmod +x platform-ci/bin/platform
          chmod +x platform-ci/lib/*.sh

      - name: Validate Service Contract
        run: |
          ./platform-ci/bin/platform validate "${{ matrix.service }}"

      - name: Test Runtime Contract
        run: |
          ./platform-ci/bin/platform test-runtime "${{ matrix.service }}"
